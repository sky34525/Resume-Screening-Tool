<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="吴旭洋 - C++ / 图形开发方向在线简历">
  <title>吴旭洋 - 在线简历</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      background: #e9eff4;
      color: #102a43;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    header {
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 12px clamp(16px, 4vw, 48px);
      background: #102a43;
      color: white;
      box-shadow: 0 5px 22px rgb(16 42 67 / 18%);
    }
    .identity strong { display: block; font-size: 18px; }
    .identity span { color: #b8e3e8; font-size: 13px; }
    .download {
      display: inline-flex;
      align-items: center;
      min-height: 40px;
      padding: 0 18px;
      border-radius: 999px;
      background: #2cb1bc;
      color: #062c33;
      font-weight: 700;
      text-decoration: none;
    }
    main { width: min(1040px, 100%); margin: 0 auto; padding: 24px; }
    .viewer {
      overflow: hidden;
      width: 100%;
      height: calc(100vh - 112px);
      min-height: 620px;
      border-radius: 14px;
      background: white;
      box-shadow: 0 18px 50px rgb(16 42 67 / 16%);
    }
    object { width: 100%; height: 100%; border: 0; }
    .fallback { padding: 32px; line-height: 1.75; }
    .fallback a { color: #147d92; }
    @media (max-width: 640px) {
      header { align-items: flex-start; }
      .identity span { display: none; }
      main { padding: 12px; }
      .viewer { height: calc(100vh - 88px); min-height: 520px; border-radius: 8px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="identity">
      <strong>吴旭洋</strong>
      <span>C++ / 图形开发方向</span>
    </div>
    <a class="download" href="../output/pdf/%E5%90%B4%E6%97%AD%E6%B4%8B-C%2B%2B%E5%9B%BE%E5%BD%A2%E5%BC%80%E5%8F%91-%E7%AE%80%E5%8E%86.pdf" download>下载 PDF</a>
  </header>
  <main>
    <section class="viewer" aria-label="PDF 简历预览">
      <object data="../output/pdf/%E5%90%B4%E6%97%AD%E6%B4%8B-C%2B%2B%E5%9B%BE%E5%BD%A2%E5%BC%80%E5%8F%91-%E7%AE%80%E5%8E%86.pdf" type="application/pdf">
        <div class="fallback">
          当前浏览器不能直接显示 PDF。请
          <a href="../output/pdf/%E5%90%B4%E6%97%AD%E6%B4%8B-C%2B%2B%E5%9B%BE%E5%BD%A2%E5%BC%80%E5%8F%91-%E7%AE%80%E5%8E%86.pdf">打开或下载简历</a>。
        </div>
      </object>
    </section>
  </main>
</body>
</html>
