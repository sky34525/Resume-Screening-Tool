name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: pip install PyPDF2

      - name: Restore
        run: dotnet restore ResumeScreening.sln

      - name: Generate signing certificate
        run: |
          $cert = New-SelfSignedCertificate -Type Custom `
            -Subject "CN=ResumeScreening" `
            -KeyUsage DigitalSignature `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3") `
            -CertStoreLocation "Cert:\CurrentUser\My"
          $pwd = ConvertTo-SecureString -String "resume123" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath publish\ResumeScreening_TemporaryKey.pfx -Password $pwd
          Write-Host "✅ 证书指纹: $($cert.Thumbprint)"

      - name: Publish API
        run: |
          dotnet publish src\ResumeScreening.Api\ResumeScreening.Api.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -o publish\api

      - name: Publish Desktop
        run: |
          dotnet publish src\ResumeScreening.Desktop\ResumeScreening.Desktop.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:Platform=x64 `
            -p:PublishTrimmed=false `
            -o publish\desktop

      - name: Create MSIX package
        run: |
          $winapp = "$env:USERPROFILE\.nuget\packages\microsoft.windows.sdk.buildtools.winapp\0.6.1\tools\win-x64\winapp.exe"
          & $winapp package publish\desktop `
            --manifest src\ResumeScreening.Desktop\Package.appxmanifest `
            --cert publish\ResumeScreening_TemporaryKey.pfx `
            --cert-password resume123 `
            --executable "ResumeScreening.Desktop.exe" `
            --output publish\ResumeScreening.msix

      - name: Create install script
        run: |
          @"
          @echo off
          echo ======================================
          echo   ResumeScreening 安装脚本
          echo ======================================
          echo.
          echo [1/2] 安装证书...
          powershell -Command "`$pwd = ConvertTo-SecureString -String 'resume123' -Force -AsPlainText; Import-PfxCertificate -FilePath 'ResumeScreening_TemporaryKey.pfx' -CertStoreLocation 'Cert:\LocalMachine\Root' -Password `$pwd"
          echo.
          echo [2/2] 安装 MSIX...
          powershell -Command "Add-AppxPackage -Path 'ResumeScreening.msix'"
          echo.
          echo 安装完成！在开始菜单找到"简历筛选助手"
          pause
          "@ | Out-File -FilePath publish\install.bat -Encoding ASCII

      - name: Create zip
        run: |
          Compress-Archive -Path @(
            "publish\ResumeScreening.msix",
            "publish\ResumeScreening_TemporaryKey.pfx",
            "publish\install.bat"
          ) -DestinationPath ResumeScreening-${{ github.ref_name }}-x64.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ResumeScreening-${{ github.ref_name }}-x64.zip
          body: |
            ## 下载安装

            1. 下载 `ResumeScreening-${{ github.ref_name }}-x64.zip` 并解压
            2. 右键 `install.bat` → **以管理员身份运行**
            3. 开始菜单找到「简历筛选助手」即可使用

            ## 系统要求
            - Windows 10 1809+ 或 Windows 11
            - 需安装 [Windows App SDK Runtime 2.5](https://aka.ms/windowsappsdk/1.6/2.5.1/windowsappruntimeinstall-x64.exe)

            ## 配置说明
            首次启动后在「设置」页面配置 DeepSeek API Key，然后确保 API 后端在本地运行。
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}