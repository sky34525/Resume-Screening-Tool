name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: pip install PyPDF2

      - name: Restore
        run: dotnet restore ResumeScreening.sln

      - name: Generate signing certificate
        run: |
          New-Item -ItemType Directory -Force -Path publish
          $cert = New-SelfSignedCertificate -Type Custom `
            -Subject "CN=ResumeScreening" `
            -KeyUsage DigitalSignature `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3") `
            -CertStoreLocation "Cert:\CurrentUser\My"
          $pwd = ConvertTo-SecureString -String "resume123" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath publish\ResumeScreening_TemporaryKey.pfx -Password $pwd
          Write-Host "✅ 证书指纹: $($cert.Thumbprint)"

      - name: Publish API
        run: |
          dotnet publish src\ResumeScreening.Api\ResumeScreening.Api.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -o publish\api

      - name: Publish Desktop
        run: |
          dotnet publish src\ResumeScreening.Desktop\ResumeScreening.Desktop.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:Platform=x64 `
            -p:PublishTrimmed=false `
            -o publish\desktop

      - name: Create MSIX package
        run: |
          $winapp = "$env:USERPROFILE\.nuget\packages\microsoft.windows.sdk.buildtools.winapp\0.6.1\tools\win-x64\winapp.exe"
          & $winapp package publish\desktop `
            --manifest src\ResumeScreening.Desktop\Package.appxmanifest `
            --cert publish\ResumeScreening_TemporaryKey.pfx `
            --cert-password resume123 `
            --executable "ResumeScreening.Desktop.exe" `
            --output publish\ResumeScreening.msix

      - name: Create zip
        run: |
          Copy-Item publish\ResumeScreening_TemporaryKey.pfx publish\msix-cert.pfx -Force
          Compress-Archive -Path @(
            "publish\ResumeScreening.msix",
            "publish\msix-cert.pfx"
          ) -DestinationPath ResumeScreening-${{ github.ref_name }}-x64.zip

      - name: Upload artifact (manual run)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: ResumeScreening-${{ github.sha }}-x64
          path: ResumeScreening-${{ github.ref_name }}-x64.zip

      - name: Create Release (tag only)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ResumeScreening-${{ github.ref_name }}-x64.zip
          body: |
            ## 安装步骤

            ### 1. 导入证书（仅首次，需管理员权限）
            右键开始菜单 → **终端(管理员)**，执行：
            ```powershell
            $pwd = ConvertTo-SecureString -String "resume123" -Force -AsPlainText; Import-PfxCertificate -FilePath "解压目录\msix-cert.pfx" -CertStoreLocation "Cert:\LocalMachine\Root" -Password $pwd
            ```
            > 将 `解压目录` 替换为实际路径

            ### 2. 安装应用
            双击 `ResumeScreening.msix` → 点击安装 → 开始菜单启动「简历筛选助手」

            ### 3. 配置
            首次启动后在「设置」页面配置 DeepSeek API Key

            ## 系统要求
            - Windows 10 1809+ 或 Windows 11
            - [Windows App SDK Runtime 2.5](https://aka.ms/windowsappsdk/1.6/2.5.1/windowsappruntimeinstall-x64.exe)
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}